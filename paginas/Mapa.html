<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emprendedores - Expo Verde 2025</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }
  
    .bg-custom {
      background-color: #6d105c !important;
    }
  
    .navbar-nav .nav-link {
      color: white !important;
    }
  
    .navbar-nav .nav-link:hover {
      color: #f0f0f0 !important;
    }
  
    /* ===== CONTENEDOR ===== */
    #contenedor-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }
  
    /* ===== TARJETAS ===== */
    .col-lg-4,
    .col-md-6,
    .col-sm-12 {
      display: flex;
    }
  
    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 15px 20px;
      text-align: left;
      transition: all 0.2s ease-in-out;
      flex-grow: 1;
      width: 100%;
      height: 100%;
      background: white;
    }
  
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
  
    /* ===== IMÁGENES ===== */
    .card img,
    .placeholder-img {
      width: 100%;
      aspect-ratio: 16 / 9; /* todas las imágenes mismo formato */
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 10px;
    }
  
    .placeholder-img {
      background-color: #f8f8f8;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ccc;
    }
  
    .placeholder-img div {
      width: 36px;
      height: 36px;
      background-color: white;
      border: 1px solid #ccc;
    }
  
    /* ===== TEXTO ===== */
    .card-title {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      color: #6d105c;
      margin-bottom: 8px;
    }
  
    .card-text {
      font-size: 0.9rem;
      margin: 5px 0;
      flex-grow: 1;
    }
  
    /* ===== BOTÓN ===== */
    .btn-detalle {
      background-color: #6d105c;
      color: white;
      border-radius: 25px;
      margin-top: 8px;
      width: 100%;
      text-align: center;
    }
  
    .btn-detalle:hover {
      background-color: #5a0c4d;
    }
  
    /* ===== DISTRIBUCIÓN ===== */
    @media (min-width: 992px) {
      /* PC: 3 por fila */
      .col-lg-4 {
        flex: 0 0 calc(33.333% - 1rem);
        max-width: calc(33.333% - 1rem);
      }
    }
  
    @media (max-width: 768px) {
      /* Modo compacto en móvil */
      .card {
        padding: 10px;
        text-align: center;
      }
  
      .card img,
      .placeholder-img {
        width: 80px;
        height: 80px;
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        margin: 0 auto 6px auto;
      }
  
      .card-text {
        display: none;
      }
  
      .card-title {
        font-size: 0.9rem;
        margin-bottom: 4px;
      }
  
      .btn-detalle {
        font-size: 0.8rem;
        padding: 3px 6px;
        border-radius: 12px;
      }
  
      /* 3 por fila */
      .col-md-6.col-sm-12.mb-4 {
        flex: 0 0 calc(33.333% - 0.5rem);
        max-width: calc(33.333% - 0.5rem);
        padding: 0;
      }
    }
  </style>
  
  
  
  
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-custom">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">
        <img src="../imagenes/ferialogo.png" width="100px" alt="Expo Verde">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a href="../paginas/Mapa.html" class="nav-link">Emprendedores</a></li>
          <li class="nav-item"><a href="../paginas/Eventos.html" class="nav-link">Eventos</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4 mb-5">
    <h2 class="mb-4 text-center text-success">Emprendedores Expo Verde 2025</h2>

    <!-- Acordeón -->
    <div class="accordion" id="accordionEmprendedores">

      <!-- Acordeón 1: Tarjetas -->
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingCards">
          <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCards"
            aria-expanded="true" aria-controls="collapseCards">
            🌿 Ver Tarjetas de Emprendimientos
          </button>
        </h2>
        <div id="collapseCards" class="accordion-collapse collapse show" aria-labelledby="headingCards"
          data-bs-parent="#accordionEmprendedores">
          <div class="accordion-body">
            <div id="contenedor-cards" class="row gx-3 gy-3"></div>
          </div>
        </div>
      </div>

      <!-- Acordeón 2: Tabla -->
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingTabla">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapseTabla" aria-expanded="false" aria-controls="collapseTabla">
            📋 Ver Listado Completo
          </button>
        </h2>
        <div id="collapseTabla" class="accordion-collapse collapse" aria-labelledby="headingTabla"
          data-bs-parent="#accordionEmprendedores">
          <div class="accordion-body">
            <div class="table-responsive">
              <table class="table table-striped table-hover" id="tabla-emprendedores">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Apellido y Nombre</th>
                    <th>Emprendimiento</th>
                    <th>Actividad</th>
                    <th>Localidad</th>
                    <th>Dirección</th>
                    <th>Teléfono</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

  <script>
 /**
 * Construye la ruta completa a una imagen basándose en el nombre de archivo
 * y el entorno de despliegue (GitHub Pages o local).
 *
 * @param {string | null} nombreArchivoFoto El nombre del archivo (ej: "9.jpeg")
 * o null si no hay foto.
 * @returns {string | null} La ruta completa a la imagen o null.
 */
function obtenerRutaImagen(nombreArchivoFoto) {
  
  // 1. Verificar si el emprendedor tiene una foto asignada
  // Si el campo 'foto' es nulo o está vacío, no hay imagen que mostrar.
  if (!nombreArchivoFoto) {
    return null;
    
    // Opcionalmente, podrías devolver la ruta a una imagen "placeholder"
    // const basePath = obtenerBasePath(); // (ver punto 2)
    // return `${basePath}placeholder.png`;
  }

  // 2. Detectar si estamos en GitHub Pages o en entorno local
  const basePath = window.location.hostname.includes("github.io")
    ? "/ExpoVerde/imagenes/"  // ✅ Ruta absoluta para GitHub Pages
    : "../imagenes/";         // ✅ Ruta relativa para entorno local

  // 3. Devuelve la ruta completa
  // Simplemente concatena la base y el nombre del archivo que ya tenías
  return `${basePath}${nombreArchivoFoto}`;
}
fetch('json-2025.json')
    .then(r => r.json())
    // 1. Quita 'async' de aquí, ya no es necesario
    .then(data => {
        const contenedor = document.getElementById('contenedor-cards');
        const tablaBody = document.querySelector('#tabla-emprendedores tbody');
        const tarjetasConImg = [];
        const tarjetasSinImg = [];

        // 1️⃣ Generar tarjetas
        for (const [index, item] of data.entries()) {
            
            // --- INICIO DE LA CORRECCIÓN ---
            
            // Lee el nombre del archivo (ej: "9.jpeg" o null)
            const nombreArchivoFoto = item.foto; 
            
            // Llama a la nueva función síncrona para construir la ruta
            const imgPath = obtenerRutaImagen(nombreArchivoFoto);
            
            // Mantenemos el 'numero' solo para el link del botón
            const numero = item["Column 16"];

            // --- FIN DE LA CORRECCIÓN ---

            const col = document.createElement('div');
            col.classList.add('col-lg-4', 'col-md-6', 'col-sm-12', 'mb-4');

            const card = document.createElement('div');
            card.classList.add('card', 'shadow-sm');

            // El resto de tu código para crear el HTML es correcto
            card.innerHTML = `
                <h5 class="card-title">${item["Nombre del emprendimiento"] || "Sin nombre"}</h5>
                ${imgPath 
                    ? `<img src="${imgPath}" alt="${item["Nombre del emprendimiento"] || "Imagen"}">`
                    : `<div class="placeholder-img"><div></div></div>`
                }
                <div class="card-text">
                    <p><strong>Emprendedor:</strong> ${item["Apellido y Nombre"] || ""}</p>
                    <p><strong>Actividad:</strong> ${item["Actividad"] || ""}</p>
                    <p><strong>Localidad:</strong> ${item["Localidad"] || ""}</p>
                </div>
                <a href="Emprendedor.html?numero=${numero}" class="btn btn-detalle">
                    <i class="fas fa-user"></i> Ver detalle
                </a>
            `;

            col.appendChild(card);

            if (imgPath) tarjetasConImg.push(col);
            else tarjetasSinImg.push(col);

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${item["Apellido y Nombre"] || ""}</td>
                <td>${item["Nombre del emprendimiento"] || ""}</td>
                <td>${item["Actividad"] || ""}</td>
                <td>${item["Localidad"] || ""}</td>
                <td>${item["Dirección del emprendimiento"] || ""}</td>
                <td>${item["Teléfono del emprendimiento"] || ""}</td>
            `;
            tablaBody.appendChild(row);
        }

        // 2️⃣ Ordenar: con imagen primero
        [...tarjetasConImg, ...tarjetasSinImg].forEach(col => contenedor.appendChild(col));
    })
    .catch(err => console.error("Error cargando json-2025.json:", err));
  </script>
  
  
  
  
</body>
</html>
