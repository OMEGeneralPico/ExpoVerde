<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emprendedores - Expo Verde 2025</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }
  
    .bg-custom {
      background-color: #6d105c !important;
    }
  
    .navbar-nav .nav-link {
      color: white !important;
    }
  
    .navbar-nav .nav-link:hover {
      color: #f0f0f0 !important;
    }
  
    /* Tarjetas */
    .card {
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 15px 20px;
      text-align: left;
      transition: all 0.2s ease-in-out;
      height: 100%;
    }
  
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
  
    .card-title {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 600;
      color: #6d105c;
      margin-bottom: 12px;
    }
  
    .card img {
      display: block;
      margin: 0 auto 10px auto;
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
    }
  
    .placeholder-img {
      width: 100%;
      height: 220px;
      background-color: #fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }
  
    .placeholder-img div {
      width: 36px;
      height: 36px;
      background-color: white;
      border: 1px solid #ccc;
    }
  
    .card-text {
      font-size: 0.95rem;
      margin: 5px 0;
    }
  
    .card-text strong {
      color: #000;
    }
  
    .btn-detalle {
      background-color: #6d105c;
      color: white;
      border-radius: 25px;
      margin-top: 10px;
      width: 100%;
      text-align: center;
    }
  
    .btn-detalle:hover {
      background-color: #5a0c4d;
    }
  </style>
  
  
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-custom">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">
        <img src="../imagenes/ferialogo.png" width="100px" alt="Expo Verde">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a href="../paginas/Mapa.html" class="nav-link">Emprendedores</a></li>
          <li class="nav-item"><a href="../paginas/Eventos.html" class="nav-link">Eventos</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4 mb-5">
    <h2 class="mb-4 text-center text-success">Emprendedores Expo Verde 2025</h2>

    <!-- Acordeón -->
    <div class="accordion" id="accordionEmprendedores">

      <!-- Acordeón 1: Tarjetas -->
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingCards">
          <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCards"
            aria-expanded="true" aria-controls="collapseCards">
            🌿 Ver Tarjetas de Emprendimientos
          </button>
        </h2>
        <div id="collapseCards" class="accordion-collapse collapse show" aria-labelledby="headingCards"
          data-bs-parent="#accordionEmprendedores">
          <div class="accordion-body">
            <div id="contenedor-cards" class="row gx-3 gy-3"></div>
          </div>
        </div>
      </div>

      <!-- Acordeón 2: Tabla -->
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingTabla">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapseTabla" aria-expanded="false" aria-controls="collapseTabla">
            📋 Ver Listado Completo
          </button>
        </h2>
        <div id="collapseTabla" class="accordion-collapse collapse" aria-labelledby="headingTabla"
          data-bs-parent="#accordionEmprendedores">
          <div class="accordion-body">
            <div class="table-responsive">
              <table class="table table-striped table-hover" id="tabla-emprendedores">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Apellido y Nombre</th>
                    <th>Emprendimiento</th>
                    <th>Actividad</th>
                    <th>Localidad</th>
                    <th>Dirección</th>
                    <th>Teléfono</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    fetch('json-2025.json')
      .then(r => r.json())
      .then(data => {
        const contenedor = document.getElementById('contenedor-cards');
        const tablaBody = document.querySelector('#tabla-emprendedores tbody');
  
        data.forEach((item, index) => {
          const numero = item["Column 16"];
          const imgPath = `../imagenes/${numero}.png`;
  
          // Columna (2 por fila)
          const col = document.createElement('div');
          col.classList.add('col-md-6', 'col-sm-12', 'mb-4');
  
          // Crear tarjeta base
          const card = document.createElement('div');
          card.classList.add('card', 'shadow-sm');
  
          // Imagen preconstruida (placeholder por defecto)
          let imgHTML = `
            <div class="placeholder-img">
              <div></div>
            </div>
          `;
  
          // Intentar precargar imagen
          const testImg = new Image();
          testImg.src = imgPath;
          testImg.onload = () => {
            // Si la imagen existe, reemplazamos el contenido más adelante
            const img = card.querySelector('.placeholder-img');
            if (img) {
              img.outerHTML = `<img src="${imgPath}" alt="${item["Nombre del emprendimiento"] || "Imagen"}">`;
            }
          };
  
          // Estructura fija: título → imagen → datos → botón
          card.innerHTML = `
            <h5 class="card-title">${item["Nombre del emprendimiento"] || "Sin nombre"}</h5>
            ${imgHTML}
            <div class="card-text">
              <p><strong>Emprendedor:</strong> ${item["Apellido y Nombre"] || ""}</p>
              <p><strong>Actividad:</strong> ${item["Actividad"] || ""}</p>
              <p><strong>Localidad:</strong> ${item["Localidad"] || ""}</p>
            </div>
            <a href="Emprendedor.html?numero=${numero}" class="btn btn-detalle">
              <i class="fas fa-user"></i> Ver detalle
            </a>
          `;
  
          // Ensamblar
          col.appendChild(card);
          contenedor.appendChild(col);
  
          // Tabla (segunda sección)
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${index + 1}</td>
            <td>${item["Apellido y Nombre"] || ""}</td>
            <td>${item["Nombre del emprendimiento"] || ""}</td>
            <td>${item["Actividad"] || ""}</td>
            <td>${item["Localidad"] || ""}</td>
            <td>${item["Dirección del emprendimiento"] || ""}</td>
            <td>${item["Teléfono del emprendimiento"] || ""}</td>
          `;
          tablaBody.appendChild(row);
        });
      })
      .catch(err => console.error("Error cargando json-2025.json:", err));
  </script>
  
  
  
</body>
</html>
